name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cheap, and it guards the one failure mode that produced no error
      # anywhere: a client defaulting to another product's deployment.
      - name: Client endpoints
        run: node scripts/check-client-endpoints.mjs

      - name: Typecheck
        run: npm run typecheck

      # No cache is restored between runs, so lint here always sees the
      # real tree. A stale local .next/cache/eslint has already hidden a
      # genuine error in a sibling repository -- this job is the check
      # that does not lie.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
